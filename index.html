<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>FAMI • Rent Management</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;
  --brand:#111827;--brand2:#2563eb;--success:#12b76a;--warning:#f79009;--danger:#f04438;
  --shadow:0 12px 32px rgba(16,24,40,.07);--radius:18px;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.shell{display:flex;min-height:100vh}
.sidebar{width:250px;background:#0b1220;color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:20;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 28px}.brandLogo{width:132px;height:auto}.loginLogo{width:180px;max-width:100%;height:auto;margin-bottom:15px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;font-weight:900;letter-spacing:-1px;color:#fff}.brand b{font-size[...]
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 13px;border-radius:11px;font-weight:700;display:flex;align-items:center;gap:10px}.n[...]
.sideBottom{margin-top:auto;border-top:1px solid #253047;padding-top:14px}.userMini{padding:10px;color:#cbd5e1;font-size:13px}
.main{margin-left:250px;width:calc(100% - 250px);padding:24px 28px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.title h1{margin:0;font-size:28[...]
.actions{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var([...]
.content{display:none}.content.active{display:block}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.panelH[...]
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800;color:#344054}.field input,.field select,.field te[...]
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:15px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.search{min-width:260px}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:12px 13px;border-bot[...]
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.badge.green{background:#ecfdf3;color:#027a48}.badge.red{background:#fef3f2;color:#[...]
.progress{height:8px;background:#eef2f6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#2563eb;border-radius:99px;transition:width .6s ease}.empty{padding:35px[...]
.kpiGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mini{padding:15px}.mini .big{font-size:22px;font-weight:900;margin-top:5px}.mini p{margin:3px 0 0;color:var(--muted);font-size:1[...]
.loginWrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#e8efff,transparent 35%),#f4f7fb}.login{width:min(430px,100%);padding:28px}.[...]
.notice{padding:12px 14px;border-radius:12px;background:#eff8ff;color:#175cd3;margin-bottom:15px;font-size:13px}.dangerNotice{background:#fef3f2;color:#b42318}
.modalBack{position:fixed;inset:0;background:#0b122080;z-index:100;display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .2s}.modalBack.open{opacity:1;point[...]
.toast{position:fixed;right:22px;bottom:22px;z-index:200;background:#101828;color:#fff;padding:12px 15px;border-radius:12px;box-shadow:0 14px 35px #0003;max-width:360px;font-size:13px;transform:tr[...]
.reportCards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.reportCard{padding:15px}.reportCard small{color:var(--muted);font-weight:800}.reportCard b{display:block;[...]
.mobileMenu{display:none}
.skeleton{animation:skeletonPulse 1.5s ease-in-out infinite;background:linear-gradient(90deg,#f2f4f7 25%,#e4e7ec 50%,#f2f4f7 75%);background-size:200% 100%;border-radius:8px}@keyframes skeletonPul[...]
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.reportCards{grid-template-columns:repeat(2,1fr)} }
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%;padding:18px 14px}.mobileMenu{display:inline-flex}.topbar{al[...]
@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.stat .num{font-size:21px}.actions{width:100%}.actions .btn{flex:1}.panel{padding:15px}}
@media print{.sidebar,.topbar,.actions,.mobileMenu,.btn{display:none!important}.main{margin-left:0;width:100%;padding:0}.panel{box-shadow:none;border:1px solid #ddd}}
/* Runtime keys form styles */
.runtime-keys {position:fixed;left:12px;right:12px;top:12px;background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;z-index:500;box-shadow:var(--shadow)}
.runtime-keys h4{margin:0 0 8px;font-size:14px}
.runtime-keys .row{display:flex;gap:8px;flex-wrap:wrap}
.runtime-keys input{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px}
.runtime-keys button{padding:8px 10px;border-radius:8px}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginView" class="loginWrap">
  <div class="card login">
    <svg class="loginLogo" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="42" height="42" rx="13" fill="url(#lg)"/>
      <text x="52" y="32" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="900" fill="#111827">FAMI</text>
      <defs><linearGradient id="lg" x1="0" y1="0" x2="42" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
    </svg>
    <h1>FAMI Rent</h1>
    <p>Professional shop, tenant and rent management.</p>
    <div class="loginTabs">
      <button id="loginTab" class="active" onclick="setAuthMode('login')">Sign in</button>
      <button id="signupTab" onclick="setAuthMode('signup')">Create account</button>
    </div>
    <div class="grid">
      <div class="field" id="nameField" style="display:none"><label>Full name</label><input id="authName" placeholder="Your name"></div>
      <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="name@example.com"></div>
      <div class="field"><label>Password</label><input id="authPassword" type="password" placeholder="Minimum 6 characters"></div>
    </div>
    <button id="authBtn" class="btn primary" style="width:100%;margin-top:15px" onclick="submitAuth()">Sign in</button>
    <div id="authMsg" class="notice hidden" style="margin-top:12px"></div>
    <div style="margin-top:18px;padding:14px;background:#f9fafb;border-radius:12px;font-size:12px;color:var(--muted)">
      <b>First time?</b> Update the <code>window.FAMI_CONFIG</code> object inside the script tag with your Supabase credentials, then refresh.
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="app hidden">
<div class="shell">
<aside id="sidebar" class="sidebar">
  <div class="brand">
    <svg class="brandLogo" viewBox="0 0 132 42" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="42" height="42" rx="13" fill="url(#bg)"/>
      <text x="52" y="30" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#fff">FAMI</text>
      <defs><linearGradient id="bg" x1="0" y1="0" x2="42" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
    </svg>
    <div><b>FAMI</b><small>Rent Management</small></div>
  </div>
  <nav class="nav">
    <button class="active" data-page="dashboard" onclick="go('dashboard')"><span>⌂</span>Dashboard</button>
    <button data-page="shops" onclick="go('shops')"><span>▣</span>Shops & Tenants</button>
    <button data-page="payments" onclick="go('payments')"><span>◉</span>Payments</button>
    <button data-page="defaults" onclick="go('defaults')"><span>!</span>Arrears</button>
    <button data-page="reports" onclick="go('reports')"><span>▤</span>Reports</button>
    <button data-page="activity" onclick="go('activity')"><span>◷</span>Activity</button>
    <button id="usersNav" data-page="users" onclick="go('users')" class="admin-only"><span>♙</span>Users</button>
  </nav>
  <div class="sideBottom">
    <div class="userMini" id="userMini"></div>
    <button class="btn" style="width:100%" onclick="logout()">Sign out</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="title">
      <button class="btn mobileMenu" onclick="toggleSide()">☰</button>
      <span style="display:inline-block;width:6px"></span>
      <span id="pageTitle">Dashboard</span>
      <p id="pageSub">Overview of rent collection and shop performance.</p>
    </div>
    <div class="actions">
      <button class="btn" onclick="refreshAll()">↻ Refresh</button>
      <button class="btn blue" onclick="openShopModal()">+ Add shop</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <section id="dashboard" class="content active">
    <div class="cards">
      <div class="card stat"><div class="statTop"><label>Total shops</label><div class="statIcon">▣</div></div><div class="num" id="sTotal">0</div><div class="sub" id="sActive">0 active</div></[...]
