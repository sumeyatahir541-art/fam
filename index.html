<!-- ===================== LOGIN ===================== -->
<div id="loginView" class="loginWrap">

    <svg class="loginLogo" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="42" height="42" rx="13" fill="url(#lg)"/>
      <text x="52" y="32" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="900" fill="#111827">FAMI</text>
      <defs><linearGradient id="lg" x1="0" y1="0" x2="42" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
    </svg>
    <h1>FAMI Rent</h1>
    <p>Professional shop, tenant and rent management.</p>
    <div class="loginTabs">
      <button id="loginTab" class="active" onclick="setAuthMode('login')">Sign in</button>
      <button id="signupTab" onclick="setAuthMode('signup')">Create account</button>
    </div>
    <div class="grid">
      <div class="field" id="nameField" style="display:none"><label>Full name</label><input id="authName" placeholder="Your name"></div>

    </div>

    <div style="margin-top:18px;padding:14px;background:#f9fafb;border-radius:12px;font-size:12px;color:var(--muted)">
      <b>First time?</b> Update the <code>window.FAMI_CONFIG</code> object inside the script tag with your Supabase credentials, then refresh.
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->

<div class="shell">

  <section id="dashboard" class="content active">

      <div class="card stat"><div class="statTop"><label>Total shops</label><div class="statIcon">▣</div></div><div class="num" id="sTotal">0</div><div class="sub" id="sActive">0 active</div></[...]

<!-- ===================== SCRIPTS ===================== -->
<!-- Inject Supabase credentials from environment variables (Vite exposes VITE_* vars). -->
<script type="module">
  window.FAMI_CONFIG = {
    SUPABASE_URL: import.meta.env.VITE_SUPABASE_URL || '',
    SUPABASE_ANON_KEY: import.meta.env.VITE_SUPABASE_ANON_KEY || '',
    DISABLE_DB: import.meta.env.VITE_DISABLE_DB || 'false'
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ===== CONFIG =====
// For Vercel deployment, these will be set as environment variables.
// For local development, you can set them here or use a .env file.
window.FAMI_CONFIG = window.FAMI_CONFIG || {
  SUPABASE_URL: 'https://your-project-ref.supabase.co', // Replace with your URL
  SUPABASE_ANON_KEY: 'your-anon-key' // Replace with your Anon Key
};

// --- Supabase Client Initialization ---
const supabaseUrl = window.FAMI_CONFIG.SUPABASE_URL;
const supabaseAnonKey = window.FAMI_CONFIG.SUPABASE_ANON_KEY;

// If credentials are missing, show a clear on-screen message instead of crashing.
const isConfigured = !!supabaseUrl && !!supabaseAnonKey && supabaseUrl.startsWith('http');
if (!isConfigured) {
    console.warn("[v0] Supabase not configured. Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY.");
    window.addEventListener('DOMContentLoaded', () => {
        const msg = document.getElementById('authMsg');
        if (msg) {
            msg.textContent = 'Supabase is not configured yet. Add your VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY environment variables, then refresh.';
            msg.className = 'notice dangerNotice';
            msg.classList.remove('hidden');
        }
        const btn = document.getElementById('authBtn');
        if (btn) btn.disabled = true;
    });
}

// Feature-flag: allow disabling DB entirely (useful for deployments without valid env vars)
const disableDb = (window.FAMI_CONFIG && (String(window.FAMI_CONFIG.DISABLE_DB) === 'true'));

function makeNoopChannel() {
  return {
    on: () => ({ subscribe: () => ({}) }),
    subscribe: () => ({}),
    removeListener: () => {},
  };
}

function makeNoopClient() {
  const noopPromise = (res = { data: [], error: null }) => Promise.resolve(res);
  return {
    auth: {
      getSession: () => Promise.resolve({ data: { session: null } }),
      onAuthStateChange: (fn) => { return () => {} },
      signInWithPassword: async () => ({ error: null }),
      signOut: async () => ({ error: null }),
      signUp: async () => ({ error: null })
    },
    from: () => ({
      select: () => noopPromise(),
      insert: () => noopPromise(),
      update: () => noopPromise(),
      delete: () => noopPromise(),
    }),
    rpc: () => noopPromise(),
    channel: () => makeNoopChannel(),
    removeChannel: () => {},
    removeAllChannels: () => {},
  };
}

let sb;
try {
  if (disableDb) {
    console.warn('DB disabled via VITE_DISABLE_DB — using noop Supabase client.');
    sb = makeNoopClient();
  } else {
    sb = createClient(supabaseUrl || 'https://placeholder.supabase.co', supabaseAnonKey || 'placeholder-key');
  }
} catch (e) {
  console.error('Error creating Supabase client, falling back to noop client.', e);
  sb = makeNoopClient();
}

let realtimeChannel = null;

function setupRealtime() {
    if (!uid()) return;
    console.log("Setting up realtime for user:", uid());
    if (realtimeChannel) sb.removeChannel(realtimeChannel);

    realtimeChannel = sb.channel ? sb.channel(`user:${uid()}`) : makeNoopChannel();
    if (realtimeChannel && realtimeChannel.on) {
      realtimeChannel.on('broadcast', { event: 'new_notification' }, ({ payload }) => {
          console.log('Received broadcast notification:', payload);
          showToast(payload.message, payload.type === 'error', payload.duration || 3500);
      });
    }

    // Subscribe to changes that might affect the current user's view
    if (sb.channel) {
      try {
        sb.channel('payments_changes')
          .on('postgres_changes', {
              event: '*',
              schema: 'public',
              table: 'payments',
          }, (payload) => {
              console.log('Payment change detected:', payload);
              refreshAll(); // Simplest approach: refresh all data
          })
          .subscribe();

        sb.channel('shops_changes')
          .on('postgres_changes', {
              event: '*',
              schema: 'public',
              table: 'shops',
          }, (payload) => {
              console.log('Shop change detected:', payload);
              refreshAll();
          })
          .subscribe();
      } catch(e) {
        console.warn('Realtime not available on noop client or error subscribing:', e);
      }
    }

    // Subscribe to user role changes if admin
    if (state.profile?.role === 'admin' && sb.channel) {
        try {
          sb.channel('profiles_changes')
            .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'profiles',
            }, (payload) => {
                console.log('Profile change detected:', payload);
                refreshAll();
            })
            .subscribe();
        } catch(e) { /* noop */ }
    }

    if (realtimeChannel && realtimeChannel.subscribe) realtimeChannel.subscribe();
    console.log("Realtime channels subscribed.");
}

function cleanupRealtime() {
    console.log("Cleaning up realtime channels.");
    if (realtimeChannel && sb.removeChannel) {
        sb.removeChannel(realtimeChannel);
        realtimeChannel = null;
    }
    if (sb.removeAllChannels) sb.removeAllChannels(); // Ensure all channels are unsubscribed
}

/* Rest of original script continues unchanged... */
</script>
</body>
</html>
